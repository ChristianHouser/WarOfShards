<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>War of Shards — Battlefield</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #10101c;
    color: #eee;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    max-width: 560px;
    margin: 0 auto;
    background: #1a1a2e;
  }

  #nav-back {
    position: absolute;
    top: 6px; left: 6px;
    z-index: 20;
    background: #0f3460cc;
    color: #ffd700;
    border: 1px solid #ffd700;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.75rem;
    font-weight: bold;
    text-decoration: none;
  }

  #btn-end-turn {
    position: absolute;
    top: 6px; right: 6px;
    z-index: 20;
    background: #7a1f1fcc;
    color: #ffb3b3;
    border: 1px solid #ff6b6b;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.75rem;
    font-weight: bold;
    cursor: pointer;
  }
  #btn-end-turn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #toast-log {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    max-width: 92%;
    background: #000000cc;
    color: #9f9;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.68rem;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast-log.show { opacity: 1; }

  #win-banner {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: #000000aa;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 10px #000;
  }
  #win-banner.show { display: flex; }

  /* ===== ZONES ===== */
  #enemy-zone {
    flex: 0 0 50%;
    display: flex;
    flex-direction: column;
    padding: 22px 6px 4px;
    border-bottom: 2px solid #0f3460;
    min-height: 0;
  }
  #board-zone {
    flex: 0 0 38%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px 8px;
    background: #142042;
    min-height: 0;
  }
  #hero-zone {
    flex: 0 0 12%;
    display: flex;
    flex-direction: column;
    padding: 4px 6px;
    border-top: 2px solid #0f3460;
    min-height: 0;
  }

  .zone-label {
    font-size: 0.62rem;
    text-align: center;
    color: #f5576c;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-bottom: 2px;
  }

  .hero-row {
    display: flex;
    gap: 4px;
    flex: 1;
    min-height: 0;
  }
  /* Enemy rows hold different counts (2 Ranged, 3 Melee) but must render
     a standardized card size — sized as if a row always holds a full
     TEAM_CAP of 5 (4 gaps of 4px each), centered, regardless of how many
     cards actually occupy that row. */
  .hero-row.enemy-row {
    justify-content: center;
  }
  .hero-row.enemy-row .card {
    flex: 0 0 calc((100% - 16px) / 5);
    width: calc((100% - 16px) / 5);
  }

  /* ===== HERO / ENEMY CARDS ===== */
  .card {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    border-radius: 8px;
    background: #2a2a4a;
    border: 2px solid #555;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 2px;
    position: relative;
    user-select: none;
    overflow: hidden;
  }
  .card.special { border-color: #c0c0c0; box-shadow: 0 0 6px #c0c0c088; }
  .card.dead { opacity: 0.25; filter: grayscale(1); }
  .card.gained { animation: manaFlash 0.6s ease; }
  /* Reused for the player's currently aimed enemy (tap an enemy to aim,
     tap a ready hero to fire at it — or auto-target if nothing's aimed). */
  .card.selected {
    box-shadow: 0 0 0 3px #00ffaa, 0 0 12px #00ffaa88;
    transform: scale(1.05);
    z-index: 3;
  }
  .card.player { cursor: pointer; }
  .card.enemy:not(.dead) { cursor: pointer; }
  @keyframes readyPulse {
    0%, 100% { box-shadow: 0 0 6px 2px #ffd70088; }
    50% { box-shadow: 0 0 15px 5px #ffd700dd; }
  }
  .card.ready:not(.selected) {
    animation: readyPulse 1.3s ease-in-out infinite;
    border-color: #ffd700;
  }
  /* The mana bar itself pulses blue as soon as there's enough for a Basic
     Attack (the "low level" attack) — starts well before a Hero's card
     goes gold-ready (which needs full/Special mana) and keeps pulsing
     until that mana is actually spent. */
  @keyframes manaBarPulse {
    0%, 100% { box-shadow: 0 0 3px 1px #00bfff77; }
    50% { box-shadow: 0 0 9px 3px #4dd2ffee; }
  }
  .mana-bar-bg.basic-ready {
    animation: manaBarPulse 1.1s ease-in-out infinite;
    border-color: #4dd2ff;
  }

  /* A matched tile's color flying to its hero's mana bar. */
  .mana-shard {
    position: fixed;
    width: 9px; height: 9px;
    border-radius: 3px;
    z-index: 60;
    pointer-events: none;
    box-shadow: 0 0 6px 2px #fff, 0 0 14px 5px currentColor;
    transition: transform 0.42s cubic-bezier(.2,.7,.3,1), opacity 0.42s ease-in;
  }
  @keyframes manaFlash {
    0% { box-shadow: 0 0 0 0 #00ffaa; }
    40% { box-shadow: 0 0 16px 4px #00ffaa; transform: scale(1.06); }
    100% { box-shadow: none; transform: scale(1); }
  }
  .card[data-color="red"]    { background: linear-gradient(160deg, #4a2020, #2a2a4a); }
  .card[data-color="green"]  { background: linear-gradient(160deg, #1a3a1a, #2a2a4a); }
  .card[data-color="blue"]   { background: linear-gradient(160deg, #1a2a4a, #2a2a4a); }
  .card[data-color="yellow"] { background: linear-gradient(160deg, #4a3a10, #2a2a4a); }
  .card[data-color="purple"] { background: linear-gradient(160deg, #3a1a4a, #2a2a4a); }

  .card-color-dot {
    position: absolute;
    top: 2px; right: 2px;
    width: 9px; height: 9px;
    border-radius: 50%;
    border: 1px solid #000;
  }
  .card-icon { font-size: 0.9rem; line-height: 1; flex-shrink: 0; }
  .card-name {
    font-size: 0.5rem;
    line-height: 1.1;
    color: #eee;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    font-weight: 600;
    flex-shrink: 0;
  }
  .hp-value {
    font-size: 0.56rem;
    line-height: 1;
    color: #f88;
    font-weight: bold;
    flex-shrink: 0;
  }
  .hp-bar-bg {
    width: 90%;
    height: 4.5px;
    background: #0a0a12;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #555;
    position: relative;
    flex-shrink: 0;
    margin-bottom: 1px;
  }
  .hp-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff4d4d, #ff8a3d);
    transition: width 0.35s ease-out;
  }
  .mana-bar-bg {
    width: 90%;
    height: 4.5px;
    background: #0a0a12;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid #555;
    position: relative;
    flex-shrink: 0;
  }
  .mana-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00e5ff, #00a0ff);
    transition: width 0.35s ease-out;
  }
  .card.enemy .mana-bar { background: linear-gradient(90deg, #f5576c, #f093fb); }
  .coverage-tag {
    font-size: 0.44rem;
    color: #9be;
    line-height: 1;
    flex-shrink: 0;
  }

  /* ===== MATCH-3 BOARD ===== */
  #board-wrap {
    width: 100%;
    height: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #board-wrap.locked { opacity: 0.55; }
  #board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 3px;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .tile {
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.25s, background 0.2s;
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: bold;
    color: rgba(0,0,0,0.35);
    user-select: none;
    touch-action: none;
  }
  .tile.empty { background: #1a1a2e; border: 1px dashed #333; cursor: default; opacity: 0.4; }
  .tile.selected { border-color: #fff; transform: scale(1.08); z-index: 2; box-shadow: 0 0 10px #fff8; }
  .tile.red    { background: #e74c3c; }
  .tile.green  { background: #2ecc71; }
  .tile.blue   { background: #3498db; }
  .tile.yellow { background: #f1c40f; }
  .tile.purple { background: #9b59b6; }
  .tile.special-bomb    { box-shadow: 0 0 0 2px #ff8c00, inset 0 0 10px rgba(0,0,0,0.5); }
  .tile.special-crystal { box-shadow: 0 0 0 2px #e0d0ff, inset 0 0 10px rgba(255,255,255,0.4); }

  /* ===== MODAL ===== */
  .modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #1e1e3f;
    border: 2px solid #e0d0ff;
    border-radius: 12px;
    padding: 16px;
    max-width: 300px;
    width: 90%;
    text-align: center;
  }
  .modal-title { font-weight: bold; margin-bottom: 12px; color: #e0d0ff; font-size: 0.85rem; }
  .modal-btn {
    display: block; width: 100%; margin: 8px 0; padding: 10px;
    color: white; border: none; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
  }
  .modal-btn.clear { background: #9b59b6; }
  .modal-btn.wave  { background: #e74c3c; }
  .modal-btn.basic   { background: #3498db; }
  .modal-btn.special { background: #e74c3c; }
  .modal-btn.cancel  { background: #555; font-size: 0.78rem; padding: 8px; }
  .modal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<div id="app">
  <a id="nav-back" href="deploy.html">🛡 Deploy</a>
  <button id="btn-end-turn" type="button" disabled>End Turn ⏭</button>
  <div id="toast-log"></div>

  <div id="enemy-zone">
    <div class="zone-label">⚔ Enemy</div>
    <div id="enemy-ranged-row" class="hero-row enemy-row"></div>
    <div id="enemy-melee-row" class="hero-row enemy-row"></div>
  </div>

  <div id="board-zone">
    <div id="board-wrap">
      <div id="board"></div>
    </div>
  </div>

  <div id="hero-zone">
    <div id="player-hero-row" class="hero-row"></div>
  </div>
</div>

<div id="win-banner"></div>

<!-- Runic Crystal Choice Modal -->
<div id="crystal-modal" class="modal">
  <div class="modal-box">
    <div id="crystal-modal-title" class="modal-title"></div>
    <button id="btn-crystal-clear" class="modal-btn clear">Clear All Tiles of This Color</button>
    <button id="btn-crystal-wave" class="modal-btn wave">🔮 Runic Wave (attack)</button>
  </div>
</div>

<!-- Attack Choice Modal (Heroes only — normal characters attack directly) -->
<div id="attack-modal" class="modal">
  <div class="modal-box">
    <div id="attack-modal-title" class="modal-title"></div>
    <button id="btn-attack-basic" class="modal-btn basic"></button>
    <button id="btn-attack-special" class="modal-btn special"></button>
    <button id="btn-attack-cancel" class="modal-btn cancel">Cancel</button>
  </div>
</div>

<script src="characters.js"></script>
<script>
// BASIC_COST, BASIC_DMG, SPECIAL_COST, SPECIAL_DMG, maxManaFor, CHARACTERS come from characters.js.
//
// This screen is the match-3 half of the battlefield, ported from the
// War-of-Shards prototype's Match_3_game.html: tile movement, matching,
// gravity/refill, and the two special tiles (Arcane Bomb, Runic Crystal)
// behave exactly as they did there. What's NOT here yet is the prototype's
// turn-based attack system (tap a hero -> pick Basic/Special -> tap a
// target) — for now every match just pays mana to your heroes below and,
// via bombs/crystals, damages the enemy squad above. Wiring up player
// attacks (and enemy counter-attacks) is the natural next step.
//
// Layout is new: the prototype placed player vs enemy in left/right
// columns split by type (Ranged/Melee). Here the enemy squad sits in a
// top-down arrangement instead — Ranged row furthest back, Melee row in
// front (closer to the board, "guarding" it) — and the player's squad is
// a single row of cards below the board, since that's all the reserved
// screen space allows.

const COLORS = ['red', 'green', 'blue', 'yellow', 'purple'];
const COLOR_HEX = { red: '#e74c3c', green: '#2ecc71', blue: '#3498db', yellow: '#f1c40f', purple: '#9b59b6' };
const COLS = 7;
const ROWS = 5;
const TEAM_SIZE = 5; // 2 Ranged + 3 Melee per side, same shape as the prototype's TEAM_CAP

// ---------- RANDOM SQUAD GENERATION ----------
// No deployment/selection screen yet, so both sides get an auto-drawn squad
// using the same constraints the prototype used for its enemy team: exactly
// 2 Ranged + 3 Melee, at most 2 Heroes (isSpecial) among the 5, and at least
// 4 distinct colors represented.
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickN(pool, n) { return shuffledCopy(pool).slice(0, n); }
function randomIntUpTo(maxInclusive) { return Math.floor(Math.random() * (maxInclusive + 1)); }
function charById(id) { return CHARACTERS.find(c => c.id === id); }

function drawSquad(buckets) {
  const RANGED_COUNT = 2, MELEE_COUNT = 3, MAX_HEROES = 2;
  const heroCount = randomIntUpTo(MAX_HEROES);
  const rangedHeroCount = randomIntUpTo(heroCount);
  const meleeHeroCount = heroCount - rangedHeroCount;
  const rangedIds = shuffledCopy([
    ...pickN(buckets.rangedHero, rangedHeroCount),
    ...pickN(buckets.rangedNonHero, RANGED_COUNT - rangedHeroCount)
  ]);
  const meleeIds = shuffledCopy([
    ...pickN(buckets.meleeHero, meleeHeroCount),
    ...pickN(buckets.meleeNonHero, MELEE_COUNT - meleeHeroCount)
  ]);
  return { rangedIds, meleeIds };
}

function buildRandomSquad() {
  const MIN_COLORS = 4;
  const buckets = { rangedHero: [], rangedNonHero: [], meleeHero: [], meleeNonHero: [] };
  CHARACTERS.forEach(c => {
    const key = (c.type === 'ranged' ? 'ranged' : 'melee') + (c.isSpecial ? 'Hero' : 'NonHero');
    buckets[key].push(c.id);
  });
  let draw = null;
  for (let attempt = 0; attempt < 50; attempt++) {
    const candidate = drawSquad(buckets);
    const colorCount = new Set([...candidate.rangedIds, ...candidate.meleeIds].map(id => charById(id).color)).size;
    if (colorCount >= MIN_COLORS) { draw = candidate; break; }
  }
  return draw || drawSquad(buckets);
}

// Same fixed lane-coverage pattern the prototype used: melee 0 aligned to
// ranged lane 0, melee 1 straddles both lanes (boundary), melee 2 aligned
// to lane 1 — a property of Ranged always having exactly 2 lanes.
function meleeCoverageEntries(meleeIds) {
  return [
    { charId: meleeIds[0], coverage: { type: 'aligned', lane: 0 } },
    { charId: meleeIds[1], coverage: { type: 'boundary', lanes: [0, 1] } },
    { charId: meleeIds[2], coverage: { type: 'aligned', lane: 1 } }
  ];
}
function coverageLabel(coverage) {
  if (!coverage) return '';
  if (coverage.type === 'aligned') return `🛡 R${coverage.lane + 1}`;
  return `🛡 R${coverage.lanes[0] + 1}+R${coverage.lanes[1] + 1}`;
}

function createHero(charDef, side, extra) {
  return {
    side,
    charId: charDef.id,
    name: charDef.name,
    type: charDef.type,
    color: charDef.color,
    hp: charDef.hp,
    maxHp: charDef.hp,
    mana: 0,
    maxMana: maxManaFor(charDef),
    isSpecial: charDef.isSpecial,
    abilityName: charDef.abilityName,
    abilityText: charDef.abilityText,
    simpleAbility: charDef.simpleAbility,
    dead: false,
    actedThisTurn: false,
    el: null,
    laneIndex: extra.laneIndex != null ? extra.laneIndex : null,
    coverage: extra.coverage || null
  };
}

function buildSquadHeroes(squad, side) {
  const list = [];
  squad.rangedIds.forEach((id, laneIndex) => list.push(createHero(charById(id), side, { laneIndex })));
  meleeCoverageEntries(squad.meleeIds).forEach(entry => {
    list.push(createHero(charById(entry.charId), side, { coverage: entry.coverage }));
  });
  return list;
}

let heroes = [];
let playerHeroes = [];
let enemyRangedHeroes = [];
let enemyMeleeHeroes = [];

// A squad saved by deploy.html looks like { back: [id|null, ...5],
// front: [{charId, band}, ...up to 5] } — back is always Ranged (fixed
// slots), front is always Melee (aligned/boundary band, same shape the
// battle engine already expects as `coverage`... except a deployed squad
// has no "filled ranged lanes" concept the way the enemy's fixed
// lane0/boundary/lane1 pattern does, so coverage here is resolved once,
// at deploy time, from the same band + back-fill math deploy.html uses.
function loadDeployedPlayerSquad() {
  let raw;
  try { raw = localStorage.getItem('warOfShards.playerSquad'); } catch (e) { return null; }
  if (!raw) return null;
  try {
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.back) || !Array.isArray(saved.front)) return null;
    const filledMask = saved.back.map(id => id !== null && id !== undefined);
    const list = [];
    saved.back.forEach((id, laneIndex) => {
      if (id) list.push(createHero(charById(id), 'player', { laneIndex }));
    });
    saved.front.forEach(entry => {
      if (!entry || !entry.charId) return;
      const band = entry.band;
      let coverage = null;
      if (band) {
        if (band.type === 'aligned') {
          coverage = filledMask[band.index] ? { type: 'aligned', lane: band.index } : null;
        } else {
          const [a, b] = band.indices;
          if (filledMask[a] && filledMask[b]) coverage = { type: 'boundary', lanes: [a, b] };
          else if (filledMask[a]) coverage = { type: 'aligned', lane: a };
          else if (filledMask[b]) coverage = { type: 'aligned', lane: b };
        }
      }
      list.push(createHero(charById(entry.charId), 'player', { coverage }));
    });
    return list.length > 0 ? list : null;
  } catch (e) {
    return null;
  }
}

function buildArmies() {
  const deployed = loadDeployedPlayerSquad();
  playerHeroes = deployed || buildSquadHeroes(buildRandomSquad(), 'player');

  const enemySquad = buildRandomSquad();
  const enemyAll = buildSquadHeroes(enemySquad, 'enemy');
  enemyRangedHeroes = enemyAll.filter(h => h.type === 'ranged');
  enemyMeleeHeroes = enemyAll.filter(h => h.type === 'melee');
  heroes = [...playerHeroes, ...enemyAll];
}

// ---------- HERO / ENEMY CARDS ----------
function buildHeroCardEl(h) {
  const card = document.createElement('div');
  card.className = `card ${h.side}` + (h.isSpecial ? ' special' : '');
  card.dataset.color = h.color;
  card.innerHTML = `
    <div class="card-color-dot" style="background:${COLOR_HEX[h.color] || h.color}"></div>
    <div class="card-icon">${h.type === 'ranged' ? '🏹' : '⚔️'}</div>
    <div class="card-name">${h.name}</div>
    <div class="hp-value">${h.hp}</div>
    <div class="hp-bar-bg">
      <div class="hp-bar" style="width:${(h.hp / h.maxHp) * 100}%"></div>
    </div>
    <div class="mana-bar-bg">
      <div class="mana-bar" style="width:${(h.mana / h.maxMana) * 100}%"></div>
    </div>
    ${h.type === 'melee' ? `<div class="coverage-tag">${coverageLabel(h.coverage)}</div>` : ''}
  `;
  card.addEventListener('click', () => onHeroCardClick(h));
  h.el = card;
  return card;
}

function updateHeroUI(h) {
  if (!h.el) return;
  h.el.classList.toggle('dead', h.dead);
  h.el.classList.toggle('ready', !h.dead && !h.actedThisTurn && h.mana >= h.maxMana);
  const hpValEl = h.el.querySelector('.hp-value');
  if (hpValEl) hpValEl.textContent = h.hp;
  const hpBarEl = h.el.querySelector('.hp-bar');
  if (hpBarEl) hpBarEl.style.width = `${(h.hp / h.maxHp) * 100}%`;
  const barEl = h.el.querySelector('.mana-bar');
  if (barEl) barEl.style.width = `${(h.mana / h.maxMana) * 100}%`;
  const barBgEl = h.el.querySelector('.mana-bar-bg');
  if (barBgEl) barBgEl.classList.toggle('basic-ready', !h.dead && !h.actedThisTurn && h.mana >= basicCostFor(h));
}

function renderArmies() {
  const enemyRangedRow = document.getElementById('enemy-ranged-row');
  const enemyMeleeRow = document.getElementById('enemy-melee-row');
  const playerRow = document.getElementById('player-hero-row');
  enemyRangedRow.innerHTML = '';
  enemyMeleeRow.innerHTML = '';
  playerRow.innerHTML = '';

  enemyRangedHeroes.forEach(h => enemyRangedRow.appendChild(buildHeroCardEl(h)));
  enemyMeleeHeroes.forEach(h => enemyMeleeRow.appendChild(buildHeroCardEl(h)));
  playerHeroes.forEach(h => playerRow.appendChild(buildHeroCardEl(h)));
}

// ---------- TOAST LOG ----------
const toastEl = document.getElementById('toast-log');
let toastTimer = null;
function log(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// ---------- TURN STATE ----------
// Turn order: (1) player swaps one tile (grants mana on a match), (2) player
// may attack with any hero at full mana, tapping "End Turn" once done —
// (3) enemy gains mana from its own (off-screen/"theoretical") board, then
// (4) enemy attacks with whatever it can, using the same targeting rules.
let currentTurn = 'player'; // 'player' | 'enemy'
let swapUsedThisTurn = false; // a turn's one board action — a swap, or a crystal tap

function updateTurnUI() {
  const btn = document.getElementById('btn-end-turn');
  if (boardFrozen) { btn.disabled = true; return; }
  if (currentTurn === 'enemy') {
    btn.textContent = 'Enemy Turn…';
    btn.disabled = true;
  } else {
    btn.textContent = 'End Turn ⏭';
    btn.disabled = !swapUsedThisTurn;
  }
}

// ---------- MATCH-3 BOARD ----------
// Ported near-verbatim from the prototype: same matching, gravity, and
// special-tile (Arcane Bomb / Runic Crystal) rules.
let board = [];
let boardSpecial = [];
let selectedTile = null;
let isAnimating = false;
let boardFrozen = false;

const boardEl = document.getElementById('board');
const boardWrapEl = document.getElementById('board-wrap');

function setBoardLocked(locked) {
  boardWrapEl.classList.toggle('locked', locked);
}

function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

function createEmptyBoard() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  boardSpecial = Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function fillBoardNoMatches() {
  createEmptyBoard();
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      let c;
      do {
        c = randomColor();
      } while (
        (x >= 2 && board[y][x-1] === c && board[y][x-2] === c) ||
        (y >= 2 && board[y-1][x] === c && board[y-2][x] === c)
      );
      board[y][x] = c;
    }
  }
}

function renderBoard() {
  boardEl.innerHTML = '';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = document.createElement('div');
      const color = board[y][x];
      const special = boardSpecial[y][x];
      if (!color) {
        tile.className = 'tile empty';
        tile.textContent = '';
      } else {
        tile.className = `tile ${color}` + (special ? ` special-${special}` : '');
        tile.textContent = special === 'bomb' ? '💣' : special === 'crystal' ? '🔮' : '';
      }
      tile.dataset.x = x;
      tile.dataset.y = y;
      tile.addEventListener('pointerdown', (e) => onTilePointerDown(e, x, y));
      boardEl.appendChild(tile);
    }
  }
}

function getTileEl(x, y) {
  return boardEl.querySelector(`[data-x="${x}"][data-y="${y}"]`);
}

function findMatchedCells() {
  const matched = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) {
    let x = 0;
    while (x < COLS) {
      const color = board[y][x];
      if (!color) { x++; continue; }
      let len = 1;
      while (x + len < COLS && board[y][x + len] === color) len++;
      if (len >= 3) for (let i = 0; i < len; i++) matched[y][x + i] = true;
      x += len;
    }
  }
  for (let x = 0; x < COLS; x++) {
    let y = 0;
    while (y < ROWS) {
      const color = board[y][x];
      if (!color) { y++; continue; }
      let len = 1;
      while (y + len < ROWS && board[y + len][x] === color) len++;
      if (len >= 3) for (let i = 0; i < len; i++) matched[y + i][x] = true;
      y += len;
    }
  }
  const cells = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (matched[y][x]) cells.push({x, y});
  return {cells, hasMatches: cells.length > 0};
}

function findMatchGroups() {
  const hMatched = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  const vMatched = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  for (let y = 0; y < ROWS; y++) {
    let x = 0;
    while (x < COLS) {
      const color = board[y][x];
      if (!color) { x++; continue; }
      let len = 1;
      while (x + len < COLS && board[y][x + len] === color) len++;
      if (len >= 3) for (let i = 0; i < len; i++) hMatched[y][x + i] = true;
      x += len;
    }
  }
  for (let x = 0; x < COLS; x++) {
    let y = 0;
    while (y < ROWS) {
      const color = board[y][x];
      if (!color) { y++; continue; }
      let len = 1;
      while (y + len < ROWS && board[y + len][x] === color) len++;
      if (len >= 3) for (let i = 0; i < len; i++) vMatched[y + i][x] = true;
      y += len;
    }
  }
  const visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  const groups = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const isMatched = hMatched[y][x] || vMatched[y][x];
      if (!isMatched || visited[y][x]) continue;
      const color = board[y][x];
      const cells = [];
      const queue = [{x, y}];
      visited[y][x] = true;
      while (queue.length) {
        const cur = queue.shift();
        cells.push(cur);
        [{x: cur.x + 1, y: cur.y}, {x: cur.x - 1, y: cur.y}, {x: cur.x, y: cur.y + 1}, {x: cur.x, y: cur.y - 1}].forEach(n => {
          if (n.x < 0 || n.x >= COLS || n.y < 0 || n.y >= ROWS) return;
          if (visited[n.y][n.x]) return;
          if (!(hMatched[n.y][n.x] || vMatched[n.y][n.x])) return;
          if (board[n.y][n.x] !== color) return;
          visited[n.y][n.x] = true;
          queue.push(n);
        });
      }
      const intersection = cells.find(c => hMatched[c.y][c.x] && vMatched[c.y][c.x]) || null;
      groups.push({color, cells, intersection});
    }
  }
  return groups;
}

function pickSpawnCell(group, swapHintCells) {
  if (swapHintCells) {
    const hit = group.cells.find(c => swapHintCells.some(s => s.x === c.x && s.y === c.y));
    if (hit) return hit;
  }
  if (group.intersection) return group.intersection;
  const sameRow = new Set(group.cells.map(c => c.y)).size === 1;
  const sorted = group.cells.slice().sort((a, b) => sameRow ? a.x - b.x : a.y - b.y);
  return sorted[Math.floor((sorted.length - 1) / 2)];
}

function applyGravityAndFill() {
  for (let x = 0; x < COLS; x++) {
    const colorStack = [];
    const specialStack = [];
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y][x]) { colorStack.push(board[y][x]); specialStack.push(boardSpecial[y][x]); }
    }
    for (let y = ROWS - 1; y >= 0; y--) {
      if (colorStack.length > 0) {
        board[y][x] = colorStack.shift();
        boardSpecial[y][x] = specialStack.shift();
      } else {
        board[y][x] = randomColor();
        boardSpecial[y][x] = null;
      }
    }
  }
}

// 1 mana per tile to every living PLAYER hero of `color` — matches grow the
// player's heroes below the board, never the enemy's.
function grantMana(color, amount) {
  const matching = heroes.filter(h => h.side === 'player' && !h.dead && h.color === color);
  matching.forEach(h => {
    const before = h.mana;
    h.mana = Math.min(h.maxMana, h.mana + amount);
    updateHeroUI(h);
    if (h.mana > before && h.el) {
      h.el.classList.remove('gained');
      void h.el.offsetWidth;
      h.el.classList.add('gained');
      setTimeout(() => { if (h.el) h.el.classList.remove('gained'); }, 700);
    }
  });
  return matching.length;
}

// A matched tile doesn't just vanish — it becomes a small bright shard of
// its own color and flies to the mana bar of the first living player hero
// of that color (or drifts toward the hero zone in general if no hero of
// that color is on the squad, since the match still happened on-screen).
function spawnManaShard(fromRect, color) {
  const shard = document.createElement('div');
  shard.className = 'mana-shard';
  const hex = COLOR_HEX[color] || color;
  shard.style.background = hex;
  shard.style.color = hex;
  const fromX = fromRect.left + fromRect.width / 2;
  const fromY = fromRect.top + fromRect.height / 2;
  shard.style.left = fromX + 'px';
  shard.style.top = fromY + 'px';
  document.body.appendChild(shard);

  const targetHero = heroes.find(h => h.side === 'player' && !h.dead && h.color === color && h.el);
  let toX, toY;
  if (targetHero) {
    const barEl = targetHero.el.querySelector('.mana-bar-bg') || targetHero.el;
    const r = barEl.getBoundingClientRect();
    toX = r.left + r.width / 2;
    toY = r.top + r.height / 2;
  } else {
    const zone = document.getElementById('hero-zone').getBoundingClientRect();
    toX = zone.left + zone.width / 2;
    toY = zone.top + 4;
  }

  requestAnimationFrame(() => {
    shard.style.transform = `translate(${toX - fromX}px, ${toY - fromY}px) scale(0.25)`;
    shard.style.opacity = '0';
  });
  setTimeout(() => shard.remove(), 460);
}

// Spawns one shard per cell, reading each tile's on-screen position before
// the caller clears it from the board — must run before renderBoard() next
// wipes/rebuilds the tile elements.
function spawnShardsForCells(cells, color) {
  (cells || []).forEach(c => {
    const el = getTileEl(c.x, c.y);
    if (el) spawnManaShard(el.getBoundingClientRect(), color);
  });
}

// Shared by board-driven damage and hero attacks: ends the battle the
// moment one side has no living heroes left.
function checkWinLoss() {
  if (boardFrozen) return;
  const enemiesAlive = heroes.filter(h => h.side === 'enemy' && !h.dead).length;
  const playersAlive = heroes.filter(h => h.side === 'player' && !h.dead).length;
  if (enemiesAlive > 0 && playersAlive > 0) return;
  boardFrozen = true;
  const banner = document.getElementById('win-banner');
  banner.textContent = enemiesAlive === 0 ? '🎉 Victory! All enemies defeated.' : '💀 Defeat — all your heroes have fallen.';
  banner.classList.add('show');
  updateTurnUI();
}

// Board-driven damage (Arcane Bomb, Runic Wave) always lands on the ENEMY
// squad — the player's board is the only one in play right now.
function dealBoardDamage(target, dmg, sourceLabel) {
  if (!target || target.dead) return;
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    target.dead = true;
    log(`${sourceLabel} defeated ${target.name}!`);
  } else {
    log(`${sourceLabel} hit ${target.name} for ${dmg} (${target.hp} HP left)`);
  }
  updateHeroUI(target);
  checkWinLoss();
}

function coverageIncludesLane(coverage, lane) {
  if (!coverage) return false;
  return coverage.type === 'aligned' ? coverage.lane === lane : coverage.lanes.includes(lane);
}

// ---------- COMBAT ----------
// Which ranged lanes are currently protected by a living melee hero on the
// given side (each melee hero carries its own `coverage`, assigned at
// deployment/squad-build — either aligned to one lane, a boundary between
// two, or null).
function getCoveredLanes(side) {
  const covered = new Set();
  heroes.forEach(h => {
    if (h.side === side && h.type === 'melee' && !h.dead && h.coverage) {
      if (h.coverage.type === 'aligned') covered.add(h.coverage.lane);
      else if (h.coverage.type === 'boundary') h.coverage.lanes.forEach(l => covered.add(l));
    }
  });
  return covered;
}

// Melee can always reach enemy Melee. Melee can only reach a specific enemy
// Ranged lane once no living enemy Melee occupies a slot covering that lane
// (fully aligned or half-step boundary). Ranged can always attack anyone.
function getValidTargets(attacker) {
  const enemySide = attacker.side === 'player' ? 'enemy' : 'player';
  const enemyMelee = heroes.filter(h => h.side === enemySide && h.type === 'melee' && !h.dead);
  const enemyRanged = heroes.filter(h => h.side === enemySide && h.type === 'ranged' && !h.dead);
  if (attacker.type === 'ranged') return [...enemyMelee, ...enemyRanged];
  const coveredLanes = getCoveredLanes(enemySide);
  const reachableRanged = enemyRanged.filter(h => !coveredLanes.has(h.laneIndex));
  return [...enemyMelee, ...reachableRanged];
}

let aimedTarget = null;         // enemy the player has pre-aimed by tapping it
let pendingActionHero = null;   // hero awaiting a Basic/Special choice in the modal

// Among LEGAL targets (see getValidTargets): highest mana wins, ties broken
// by lowest HP. Used whenever an attack resolves without an aimed target —
// both the player's un-aimed taps and every enemy AI attack.
function pickAutoTarget(attacker) {
  const targets = getValidTargets(attacker);
  if (targets.length === 0) return null;
  let best = targets[0];
  for (const t of targets) {
    if (t.mana > best.mana || (t.mana === best.mana && t.hp < best.hp)) best = t;
  }
  return best;
}

// Highlights whichever enemy is currently aimed (blue ring, reusing the
// .selected style). There's no "selected attacker" state anymore — tapping
// a ready hero resolves its attack immediately (aimed target if one's set,
// else auto-target), so nothing needs to visually wait for a target tap.
function refreshAimUI() {
  heroes.forEach(h => {
    if (!h.el) return;
    h.el.classList.toggle('selected', h === aimedTarget);
  });
}

function onHeroCardClick(h) {
  if (boardFrozen || isAnimating || h.dead) return;

  if (h.side === 'enemy') {
    // Tapping an enemy just marks (or clears) where your NEXT attack should
    // go — it's not itself an action, so it's allowed any time on your turn.
    if (currentTurn !== 'player') return;
    if (aimedTarget === h) {
      aimedTarget = null;
      log('Aim cleared.');
    } else {
      aimedTarget = h;
      log(`Aiming at ${h.name} — tap a ready hero to attack.`);
    }
    refreshAimUI();
    return;
  }

  if (currentTurn !== 'player') return;
  if (!swapUsedThisTurn) {
    log('Swap a tile first — attacks come after your swap.');
    return;
  }
  if (h.actedThisTurn) {
    log(`${h.name} already acted this turn.`);
    return;
  }
  const cost = basicCostFor(h);
  if (h.mana < cost) {
    log(`${h.name} needs at least ${cost} mana (has ${h.mana}).`);
    return;
  }
  // No legal target at all (per Auto-target priority) -> don't attack, and
  // say why, before ever spending mana or opening the Basic/Special modal.
  if (getValidTargets(h).length === 0) {
    log(`${h.name} has no legal target${h.type === 'melee' ? ' — every enemy is dead or still guarded' : ''}.`);
    return;
  }
  // Heroes with a Special get a Basic-vs-Special choice; normal characters
  // have only Basic, so their attack resolves immediately on tap.
  if (h.isSpecial) {
    pendingActionHero = h;
    document.getElementById('attack-modal-title').textContent =
      `${h.name} ★${h.abilityName ? ' — ' + h.abilityName : ''} (mana: ${h.mana}/${h.maxMana})`;
    const btnBasic = document.getElementById('btn-attack-basic');
    const btnSpecial = document.getElementById('btn-attack-special');
    btnBasic.textContent = `Basic (${cost} mana → ${basicDmgFor(h)} dmg)`;
    btnBasic.disabled = h.mana < cost;
    btnSpecial.textContent = `Special (${SPECIAL_COST} mana → ${SPECIAL_DMG} dmg)${h.abilityText ? ' — ' + h.abilityText : ''}`;
    btnSpecial.disabled = h.mana < SPECIAL_COST;
    document.getElementById('attack-modal').classList.add('show');
    return;
  }
  resolveHeroAttack(h, 'basic');
}

// Resolves an attack the instant a hero/ability is chosen: the pre-aimed
// enemy if one was tapped and is still a legal target, otherwise the
// Auto-target priority (highest mana, ties by lowest HP).
function resolveHeroAttack(attacker, attackType) {
  const legal = getValidTargets(attacker);
  let target;
  if (aimedTarget && legal.includes(aimedTarget)) {
    target = aimedTarget;
  } else {
    if (aimedTarget) log(`${attacker.name} can't reach ${aimedTarget.name} — auto-targeting instead.`);
    target = pickAutoTarget(attacker);
  }
  aimedTarget = null;
  refreshAimUI();
  if (!target) {
    log(`${attacker.name} has no legal target — attack cancelled.`);
    return;
  }
  performAttack(attacker, target, attackType);
}

function performAttack(attacker, target, attackType) {
  if (attacker.dead || target.dead) return;

  let cost, dmg, usedSpecial = false;
  const targetWasDamaged = target.hp < target.maxHp;
  const targetWasLowHp = target.hp <= 3;

  if (attackType === 'special') {
    if (!attacker.isSpecial) { log(`${attacker.name} has no Special attack.`); return; }
    if (attacker.mana < SPECIAL_COST) { log('Not enough mana for Special.'); return; }
    cost = SPECIAL_COST;
    dmg = SPECIAL_DMG;
    usedSpecial = true;
    // Simple, already-implemented special effects (flat modifiers only —
    // see characters.js header for what's wired up vs. description-only).
    if (attacker.simpleAbility === 'divineStrike' && targetWasDamaged) dmg += 1;
    if (attacker.simpleAbility === 'brutal' && targetWasLowHp) dmg += 1;
  } else {
    cost = basicCostFor(attacker);
    if (attacker.mana < cost) { log('Not enough mana.'); return; }
    dmg = basicDmgFor(attacker);
  }

  attacker.mana -= cost;
  target.hp -= dmg;
  if (target.hp <= 0) {
    target.hp = 0;
    target.dead = true;
    log(`${attacker.name}${usedSpecial ? ' ★' : ''} defeated ${target.name}!`);
  } else {
    log(`${attacker.name}${usedSpecial ? ' ★' : ''} hit ${target.name} for ${dmg} (${target.hp} HP left)`);
  }

  if (attacker.simpleAbility === 'frenzy') {
    const before = attacker.mana;
    attacker.mana = Math.min(attacker.maxMana, attacker.mana + 1);
    if (attacker.mana > before) log(`${attacker.name}'s Frenzy grants +1 mana.`);
  }

  attacker.actedThisTurn = true;
  updateHeroUI(attacker);
  updateHeroUI(target);
  checkWinLoss();
  checkAutoEndPlayerTurn();
}

// Each hero gets one attack per turn. Once every living player hero is
// "resolved" — it already attacked, OR it simply can't afford its own
// Basic Attack and never will this turn (mana only grows from here, but
// there's nothing left to swap for) — there's nothing left to do, so end
// the turn automatically (after a momentary pause) instead of making the
// player tap End Turn.
function checkAutoEndPlayerTurn() {
  if (boardFrozen || currentTurn !== 'player' || isAnimating) return;
  if (!swapUsedThisTurn) return;
  const living = heroes.filter(h => h.side === 'player' && !h.dead);
  if (living.length === 0) return;
  const allResolved = living.every(h => h.actedThisTurn || h.mana < basicCostFor(h));
  if (!allResolved) return;
  log('No more heroes can act — enemy turn begins.');
  transitionToEnemyTurn(700);
}

const attackModal = document.getElementById('attack-modal');
document.getElementById('btn-attack-basic').addEventListener('click', () => {
  if (!pendingActionHero) return;
  const cost = basicCostFor(pendingActionHero);
  if (pendingActionHero.mana < cost) { log(`Not enough mana for Basic (need ${cost}).`); return; }
  const h = pendingActionHero;
  pendingActionHero = null;
  attackModal.classList.remove('show');
  resolveHeroAttack(h, 'basic');
});
document.getElementById('btn-attack-special').addEventListener('click', () => {
  if (!pendingActionHero) return;
  if (pendingActionHero.mana < SPECIAL_COST) { log('Not enough mana for Special (need 5).'); return; }
  const h = pendingActionHero;
  pendingActionHero = null;
  attackModal.classList.remove('show');
  resolveHeroAttack(h, 'special');
});
document.getElementById('btn-attack-cancel').addEventListener('click', () => {
  pendingActionHero = null;
  attackModal.classList.remove('show');
  log('Attack cancelled.');
});

// ---------- END TURN / ENEMY TURN ----------
// Shared by the manual End Turn button and the automatic "everyone's
// attacked" case: clears any pending aim, flips to the enemy, and gives a
// momentary pause before the enemy actually starts acting.
function transitionToEnemyTurn(pauseMs) {
  aimedTarget = null;
  refreshAimUI();
  currentTurn = 'enemy';
  updateTurnUI();
  setTimeout(runEnemyTurn, pauseMs);
}

// End Turn is for when the player still has an actionable hero (mana for
// at least Basic) but chooses not to use it — e.g. banking a Hero's
// Special for next turn instead of spending it now.
function endPlayerTurn() {
  if (boardFrozen || currentTurn !== 'player') return;
  if (!swapUsedThisTurn) { log('Swap a tile first.'); return; }
  log('Enemy turn...');
  transitionToEnemyTurn(500);
}
document.getElementById('btn-end-turn').addEventListener('click', endPlayerTurn);

// Enemy has no visible board of its own — it "gains mana from its
// theoretical match-3 board" by granting a modest, random-color batch of
// mana to its own matching-color heroes, same size as an ordinary 3-match.
function runEnemyManaPhase() {
  const color = randomColor();
  const amount = 3;
  const matching = heroes.filter(h => h.side === 'enemy' && !h.dead && h.color === color);
  matching.forEach(h => {
    h.mana = Math.min(h.maxMana, h.mana + amount);
    updateHeroUI(h);
  });
  log(`Enemy's board matches ${color} — enemy gains mana.`);
}

// Same getValidTargets/performAttack the player uses — the enemy just
// auto-picks the first legal target for each hero that can afford to act,
// one at a time with a short pause so the player can follow along.
function runEnemyAttacks(attackers, idx) {
  if (boardFrozen) return;
  if (idx >= attackers.length) { endEnemyTurn(); return; }
  const attacker = attackers[idx];
  if (attacker.dead || attacker.mana < basicCostFor(attacker)) {
    runEnemyAttacks(attackers, idx + 1);
    return;
  }
  const target = pickAutoTarget(attacker);
  if (!target) {
    runEnemyAttacks(attackers, idx + 1);
    return;
  }
  const attackType = (attacker.isSpecial && attacker.mana >= SPECIAL_COST) ? 'special' : 'basic';
  performAttack(attacker, target, attackType);
  setTimeout(() => runEnemyAttacks(attackers, idx + 1), 700);
}

function runEnemyTurn() {
  if (boardFrozen) return;
  runEnemyManaPhase();
  setTimeout(() => {
    const attackers = heroes.filter(h => h.side === 'enemy' && !h.dead);
    runEnemyAttacks(attackers, 0);
  }, 700);
}

function endEnemyTurn() {
  if (boardFrozen) return;
  heroes.forEach(h => { h.actedThisTurn = false; updateHeroUI(h); });
  swapUsedThisTurn = false;
  currentTurn = 'player';
  updateTurnUI();
  log('Your turn — swap a tile.');
}

// Runic Crystal Option B: the wave comes from the player toward the enemy
// (once there's art for it) and travels down each enemy lane independently,
// hitting at most one target per lane/column — full 3 to a guarding Melee,
// or full 3 to a Ranged unit only if that lane is fully exposed (no Melee
// covering it at all, aligned or boundary). A Ranged unit only partially
// covered by a boundary guard takes no damage for now.
function resolveRunicWaveHits() {
  const hits = [];
  for (let lane = 0; lane < 2; lane++) {
    const guard = heroes.find(h => h.side === 'enemy' && h.type === 'melee' && !h.dead && coverageIncludesLane(h.coverage, lane));
    const rangedHere = heroes.find(h => h.side === 'enemy' && h.type === 'ranged' && !h.dead && h.laneIndex === lane);
    if (guard) {
      if (!hits.some(hh => hh.hero === guard)) hits.push({hero: guard, dmg: 3});
    } else if (rangedHere) {
      hits.push({hero: rangedHere, dmg: 3});
    }
  }
  return hits;
}

function applyBombExplosion(item, toClear, explosionQueue, queuedKeys, logParts) {
  const {x, y} = item;
  const selfKey = `${x},${y}`;
  const selfColor = item.color || board[y][x];
  if (!toClear.has(selfKey) && selfColor) {
    toClear.add(selfKey);
    spawnShardsForCells([{x, y}], selfColor);
    grantMana(selfColor, 1);
    logParts.push(`${selfColor} +1 (bomb core)`);
  }
  const affected = {};
  const affectedCells = {};
  [{x: x + 1, y}, {x: x - 1, y}, {x, y: y + 1}, {x, y: y - 1}].forEach(n => {
    if (n.x < 0 || n.x >= COLS || n.y < 0 || n.y >= ROWS) return;
    const k = `${n.x},${n.y}`;
    const nColor = board[n.y][n.x];
    if (!nColor || toClear.has(k)) return;
    toClear.add(k);
    affected[nColor] = (affected[nColor] || 0) + 1;
    (affectedCells[nColor] = affectedCells[nColor] || []).push({x: n.x, y: n.y});
    const nType = boardSpecial[n.y][n.x];
    if (nType && !queuedKeys.has(k)) {
      queuedKeys.add(k);
      explosionQueue.push({x: n.x, y: n.y, type: nType});
    }
  });
  Object.entries(affected).forEach(([c, cnt]) => {
    spawnShardsForCells(affectedCells[c], c);
    grantMana(c, cnt);
    logParts.push(`${c} +${cnt} (bomb blast)`);
  });

  const frontline = heroes.filter(h => h.side === 'enemy' && h.type === 'melee' && !h.dead);
  if (frontline.length > 0) {
    const target = frontline[Math.floor(Math.random() * frontline.length)];
    dealBoardDamage(target, 2, '💣 Arcane Bomb');
  } else {
    log('💣 Arcane Bomb detonates, but there\'s no living enemy front-line unit to hit.');
  }
}

function applyCrystalEffect(item, choice, toClear, explosionQueue, queuedKeys, logParts) {
  const {x, y, color} = item;
  const selfKey = `${x},${y}`;
  if (!toClear.has(selfKey)) {
    toClear.add(selfKey);
    spawnShardsForCells([{x, y}], color);
    grantMana(color, 1);
    logParts.push(`${color} +1 (crystal)`);
  }
  if (choice === 'clear') {
    let count = 0;
    const clearedCells = [];
    for (let yy = 0; yy < ROWS; yy++) {
      for (let xx = 0; xx < COLS; xx++) {
        if (board[yy][xx] !== color) continue;
        const k = `${xx},${yy}`;
        if (toClear.has(k)) continue;
        toClear.add(k);
        count++;
        clearedCells.push({x: xx, y: yy});
        const t = boardSpecial[yy][xx];
        if (t && !queuedKeys.has(k)) { queuedKeys.add(k); explosionQueue.push({x: xx, y: yy, type: t}); }
      }
    }
    if (count > 0) {
      spawnShardsForCells(clearedCells, color);
      grantMana(color, count);
      logParts.push(`${color} +${count} (Runic Crystal: Clear Color)`);
    }
    log(`🔮 Runic Crystal clears every ${color} tile on the board!`);
  } else {
    const hits = resolveRunicWaveHits();
    if (hits.length === 0) {
      log('🔮 Runic Wave surges forward but finds no living enemy to strike.');
    } else {
      hits.forEach(h => dealBoardDamage(h.hero, h.dmg, '🔮 Runic Wave'));
    }
  }
}

const crystalModal = document.getElementById('crystal-modal');
const crystalModalTitle = document.getElementById('crystal-modal-title');
const btnCrystalClear = document.getElementById('btn-crystal-clear');
const btnCrystalWave = document.getElementById('btn-crystal-wave');

function showCrystalChoiceModal(color, onChoice) {
  crystalModalTitle.textContent = `🔮 Runic Crystal (${color}) — choose an effect:`;
  crystalModal.classList.add('show');
  const cleanup = () => {
    crystalModal.classList.remove('show');
    btnCrystalClear.onclick = null;
    btnCrystalWave.onclick = null;
  };
  btnCrystalClear.onclick = () => { cleanup(); onChoice('clear'); };
  btnCrystalWave.onclick = () => { cleanup(); onChoice('wave'); };
}

function processExplosionQueue(queue, idx, toClear, queuedKeys, logParts, done) {
  if (idx >= queue.length) { done(); return; }
  const item = queue[idx];
  if (item.type === 'bomb') {
    applyBombExplosion(item, toClear, queue, queuedKeys, logParts);
    processExplosionQueue(queue, idx + 1, toClear, queuedKeys, logParts, done);
  } else {
    showCrystalChoiceModal(item.color, (choice) => {
      applyCrystalEffect(item, choice, toClear, queue, queuedKeys, logParts);
      processExplosionQueue(queue, idx + 1, toClear, queuedKeys, logParts, done);
    });
  }
}

function processMatches(swapHint, activationSeeds) {
  const groups = findMatchGroups();
  if (groups.length === 0 && (!activationSeeds || activationSeeds.length === 0)) {
    isAnimating = false;
    selectedTile = null;
    setBoardLocked(false);
    checkAutoEndPlayerTurn();
    return;
  }

  const preExisting = boardSpecial.map(row => row.slice());
  const toClear = new Set();
  const spawns = [];
  const explosionQueue = [];
  const queuedKeys = new Set();
  const logParts = [];

  function queueExplosionIfSpecial(x, y) {
    const type = preExisting[y][x];
    if (!type || type !== 'bomb') return;
    const k = `${x},${y}`;
    if (queuedKeys.has(k)) return;
    queuedKeys.add(k);
    explosionQueue.push({x, y, color: board[y][x], type});
  }

  (activationSeeds || []).forEach(seed => {
    const k = `${seed.x},${seed.y}`;
    if (queuedKeys.has(k)) return;
    queuedKeys.add(k);
    explosionQueue.push(seed);
  });

  groups.forEach(group => {
    const spawnType = group.cells.length >= 5 ? 'crystal' : group.cells.length === 4 ? 'bomb' : null;
    const spawnCell = spawnType ? pickSpawnCell(group, swapHint) : null;
    group.cells.forEach(c => {
      if (spawnCell && c.x === spawnCell.x && c.y === spawnCell.y) {
        queueExplosionIfSpecial(c.x, c.y);
        return;
      }
      toClear.add(`${c.x},${c.y}`);
      queueExplosionIfSpecial(c.x, c.y);
    });
    if (spawnCell) spawns.push({x: spawnCell.x, y: spawnCell.y, color: group.color, type: spawnType});
    const gain = group.cells.length;
    spawnShardsForCells(group.cells.filter(c => !(spawnCell && c.x === spawnCell.x && c.y === spawnCell.y)), group.color);
    const grantedTo = grantMana(group.color, gain);
    logParts.push(`${group.color} +${gain}${spawnCell ? ` (spawns ${spawnType === 'crystal' ? 'Runic Crystal' : 'Arcane Bomb'})` : ''}${grantedTo === 0 ? ' (no hero of this color)' : ''}`);
  });
  if (logParts.length > 0) log(`Match! ${logParts.join(' | ')}`);

  processExplosionQueue(explosionQueue, 0, toClear, queuedKeys, logParts, () => {
    toClear.forEach(k => {
      const [cx, cy] = k.split(',').map(Number);
      board[cy][cx] = null;
      boardSpecial[cy][cx] = null;
    });
    spawns.forEach(s => {
      if (toClear.has(`${s.x},${s.y}`)) return;
      board[s.y][s.x] = s.color;
      boardSpecial[s.y][s.x] = s.type;
    });
    renderBoard();

    setTimeout(() => {
      applyGravityAndFill();
      renderBoard();

      setTimeout(() => {
        const again = findMatchedCells();
        if (again.hasMatches) {
          processMatches();
        } else {
          isAnimating = false;
          selectedTile = null;
          setBoardLocked(false);
          checkAutoEndPlayerTurn();
        }
      }, 220);
    }, 280);
  });
}

// ---------- TILE INTERACTION: tap-to-select-then-tap, or slide ----------
// Both gestures funnel into attemptSwap() so tap and slide behave
// identically once a source/target pair is decided. A pointerdown starts
// tracking; if the pointer moves past SLIDE_THRESHOLD before release, it's
// treated as a slide toward whichever adjacent tile is in that direction
// and fires immediately. If it's released without crossing the threshold,
// it's a plain tap, which falls back to the classic select-then-tap-an-
// adjacent-tile flow.
const SLIDE_THRESHOLD = 14; // px of pointer movement before a drag counts as a directional slide
let gestureState = null; // {x, y, startClientX, startClientY, moved}

function onTilePointerDown(e, x, y) {
  if (boardFrozen || isAnimating) return;
  if (currentTurn !== 'player') return;
  if (swapUsedThisTurn) {
    log('You already used this turn\'s board action — attack with a ready hero, or End Turn.');
    return;
  }
  if (!board[y][x]) return;
  // Stop the browser from treating this as a page-scroll/pan gesture —
  // touch-action:none on the tile handles most of it, but Safari in
  // particular still needs preventDefault on the originating pointerdown.
  e.preventDefault();
  gestureState = { x, y, startClientX: e.clientX, startClientY: e.clientY, moved: false };
  window.addEventListener('pointermove', onTilePointerMove);
  window.addEventListener('pointerup', onTilePointerUp);
}

function onTilePointerMove(e) {
  if (!gestureState || gestureState.moved) return;
  e.preventDefault();
  const dx = e.clientX - gestureState.startClientX;
  const dy = e.clientY - gestureState.startClientY;
  if (Math.abs(dx) < SLIDE_THRESHOLD && Math.abs(dy) < SLIDE_THRESHOLD) return;
  gestureState.moved = true;

  const sx = gestureState.x, sy = gestureState.y;
  let tx = sx, ty = sy;
  if (Math.abs(dx) > Math.abs(dy)) tx = sx + (dx > 0 ? 1 : -1);
  else ty = sy + (dy > 0 ? 1 : -1);

  cleanupGesture();
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return;
  clearSelection();
  attemptSwap(sx, sy, tx, ty);
}

function onTilePointerUp(e) {
  if (!gestureState) return;
  const { x, y, moved } = gestureState;
  cleanupGesture();
  if (!moved) handleTap(x, y);
}

function cleanupGesture() {
  window.removeEventListener('pointermove', onTilePointerMove);
  window.removeEventListener('pointerup', onTilePointerUp);
  gestureState = null;
}

function clearSelection() {
  if (!selectedTile) return;
  const el = getTileEl(selectedTile.x, selectedTile.y);
  if (el) el.classList.remove('selected');
  selectedTile = null;
}

// Tapping a Runic Crystal on its own (nothing else selected, or the tap
// doesn't complete an adjacent swap) activates it — same choice modal as
// always. Counts as this turn's one board action, same as a swap.
function activateCrystalTap(x, y) {
  const el = getTileEl(x, y);
  if (el) el.classList.add('selected');
  isAnimating = true;
  swapUsedThisTurn = true;
  updateTurnUI();
  setBoardLocked(true);
  setTimeout(() => {
    if (el) el.classList.remove('selected');
    processMatches(null, [{x, y, color: board[y][x], type: 'crystal'}]);
  }, 120);
}

function handleTap(x, y) {
  if (boardFrozen || isAnimating) return;
  if (!board[y][x]) return;

  const isCrystal = boardSpecial[y][x] === 'crystal';

  if (isCrystal && !selectedTile) {
    activateCrystalTap(x, y);
    return;
  }

  if (!selectedTile) {
    selectedTile = {x, y};
    const el = getTileEl(x, y);
    if (el) el.classList.add('selected');
    return;
  }

  const x1 = selectedTile.x, y1 = selectedTile.y;
  clearSelection();

  const dx = Math.abs(x - x1), dy = Math.abs(y - y1);
  if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
    // Adjacent to the pending selection — move/swap it in, same as any
    // other tile, crystal included.
    attemptSwap(x1, y1, x, y);
  } else if (isCrystal) {
    // Not completing a swap — a lone tap on a crystal always activates it.
    activateCrystalTap(x, y);
  } else {
    selectedTile = {x, y};
    const el = getTileEl(x, y);
    if (el) el.classList.add('selected');
  }
}

// Animates whatever's currently rendered at the two given cells sliding to
// swap places (CSS transform, riding the .tile transition already defined),
// then hands off to `callback` once the slide lands. Purely visual — the
// caller is responsible for board data, which should already reflect the
// end state so the elements arrive showing the right thing once re-rendered.
function animateTileSwap(x1, y1, x2, y2, callback) {
  const el1 = getTileEl(x1, y1);
  const el2 = getTileEl(x2, y2);
  if (!el1 || !el2) { callback(); return; }
  const r1 = el1.getBoundingClientRect();
  const r2 = el2.getBoundingClientRect();
  const dx = r2.left - r1.left, dy = r2.top - r1.top;
  el1.style.zIndex = el2.style.zIndex = 5;
  el1.style.transform = `translate(${dx}px, ${dy}px)`;
  el2.style.transform = `translate(${-dx}px, ${-dy}px)`;
  setTimeout(callback, 160);
}

function swapBoardData(x1, y1, x2, y2) {
  const tmpColor = board[y1][x1], tmpSpecial = boardSpecial[y1][x1];
  board[y1][x1] = board[y2][x2];
  boardSpecial[y1][x1] = boardSpecial[y2][x2];
  board[y2][x2] = tmpColor;
  boardSpecial[y2][x2] = tmpSpecial;
}

// Shared by both the tap and slide gestures. Slides the two tiles into
// each other's spots (data swaps first, so the sliding tiles carry their
// color/special with them), holds briefly so the swap actually reads as a
// swap, then either resolves the match or slides back and reverts.
function attemptSwap(x1, y1, x2, y2) {
  if (boardFrozen || isAnimating) return;
  if (!board[y1][x1] || !board[y2][x2]) return;

  isAnimating = true;
  setBoardLocked(true);
  swapBoardData(x1, y1, x2, y2);

  animateTileSwap(x1, y1, x2, y2, () => {
    renderBoard();

    const {hasMatches} = findMatchedCells();
    const activationSeeds = [];
    if (boardSpecial[y1][x1] === 'bomb') activationSeeds.push({x: x1, y: y1, color: board[y1][x1], type: 'bomb'});
    if (boardSpecial[y2][x2] === 'bomb') activationSeeds.push({x: x2, y: y2, color: board[y2][x2], type: 'bomb'});

    if (hasMatches || activationSeeds.length > 0) {
      swapUsedThisTurn = true;
      updateTurnUI();
      // Hold the swapped-but-not-yet-cleared state on screen for a beat so
      // the swap itself reads clearly before tiles start disappearing.
      const swapHint = [{x: x1, y: y1}, {x: x2, y: y2}];
      setTimeout(() => processMatches(swapHint, activationSeeds), 220);
    } else {
      setTimeout(() => {
        swapBoardData(x1, y1, x2, y2); // revert
        animateTileSwap(x1, y1, x2, y2, () => {
          renderBoard();
          log('No match – swap reverted');
          isAnimating = false;
          setBoardLocked(false);
        });
      }, 260);
    }
  });
}

// ---------- INIT ----------
buildArmies();
renderArmies();
fillBoardNoMatches();
renderBoard();
updateTurnUI();
log('Your turn — swap a tile to begin.');
</script>
